apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels:
    app: flag-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          # A tag abaixo é atualizada automaticamente pelo job gitops-update
          # do pipeline de CI (.github/workflows/reusable-python-ci.yml).
          image: 711747463826.dkr.ecr.us-east-1.amazonaws.com/flag-service:v1.0.0-init
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: flag-service-secrets
          env:
            - name: PORT
              value: "8002"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
