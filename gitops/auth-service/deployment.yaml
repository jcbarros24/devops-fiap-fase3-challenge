apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # A tag abaixo é atualizada automaticamente pelo job gitops-update
          # do pipeline de CI (.github/workflows/reusable-go-ci.yml).
          image: 711747463826.dkr.ecr.us-east-1.amazonaws.com/auth-service:v1.0.0-init
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: auth-service-secrets
          env:
            - name: PORT
              value: "8001"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
