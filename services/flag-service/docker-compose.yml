services:
  postgres:
    image: postgres:16-alpine
    container_name: flag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flag_pass}
      POSTGRES_DB: ${POSTGRES_DB:-flags_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flag_user} -d ${POSTGRES_DB:-flags_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flag-service
    restart: unless-stopped
    ports:
      - "${PORT:-8002}:8002"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flag_user}:${POSTGRES_PASSWORD:-flag_pass}@postgres:5432/${POSTGRES_DB:-flags_db}?sslmode=disable
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8001}
      PORT: 8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
