services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: analytics-dynamodb-local
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    working_dir: /home/dynamodblocal
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "${PORT:-8005}:8005"
    environment:
      PORT: 8005
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE:-ToggleMasterAnalytics}
      AWS_SQS_URL: ${AWS_SQS_URL}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
    depends_on:
      - dynamodb-local
