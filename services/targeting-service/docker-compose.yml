services:
  postgres:
    image: postgres:16-alpine
    container_name: targeting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-targeting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-targeting_pass}
      POSTGRES_DB: ${POSTGRES_DB:-targeting_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-targeting_user} -d ${POSTGRES_DB:-targeting_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  targeting-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: targeting-service
    restart: unless-stopped
    ports:
      - "${PORT:-8003}:8003"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-targeting_user}:${POSTGRES_PASSWORD:-targeting_pass}@postgres:5432/${POSTGRES_DB:-targeting_db}?sslmode=disable
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8001}
      PORT: 8003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
